name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [priority and override rules](https://github.com/Ryckie/Home-Modes-Advanced/blob/main/docs/priority-and-overrides.md) first; many surprises are documented behaviour.
        **Do not post passwords, tokens or Alarmo codes.** Look through the files you attach.
  - type: input
    id: version
    attributes:
      label: Home Modes Advanced version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version and install type
      placeholder: "2026.10.4, Home Assistant OS"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics download
      description: "Settings → Devices & services → Home Modes Advanced → ⋮ → Download diagnostics. Drag the file here."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: "Enable debug logging (docs/debug-logging.md), reproduce the problem, then paste the relevant lines or attach the log."
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Auto-rules, Overrides, Permissions / guests, Alarmo bridge, Cards, Assist, Notifications, Vacation simulation, Migration / import, Blueprints, Other]
