name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
      description: Could an automation, blueprint or the existing options do it?
  - type: checkboxes
    id: local
    attributes:
      label: Scope
      options:
        - label: It can work fully locally, without new external dependencies.
          required: true
